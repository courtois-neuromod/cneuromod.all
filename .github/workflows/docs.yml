name: Deploy Sphinx Docs to Pages

on:
  push:
    branches: ["main"] # Triggers on push to your default main branch
  workflow_dispatch:   # Allows you to run this workflow manually from the Actions tab
  workflow_run:
    # A GITHUB_TOKEN push (as stats-main.yml makes) does not itself re-trigger
    # `push`-based workflows, so the stats commit needs this explicit chain —
    # otherwise docs would deploy stale dataset_info.yaml numbers.
    workflows: ["Refresh statistics (main)"]
    types: [completed]

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Every push to main fires this workflow twice: once directly, and once via the
# workflow_run chain after the stats commit. Both build the same commit range, so
# cancel the earlier, pre-stats run and let the later, stats-fresh one deploy.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Automatically caches installed pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install docs/

      - name: Build HTML documentation
        run: |
          # Compiles your .rst/.md files into the static HTML site
          # Replace 'docs' and 'docs/_build/html' with your source and output paths if different
          sphinx-build -b html docs/source docs/_build/html

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this to the output HTML directory from the step above
          path: 'docs/_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
